# ~/.codex/config.toml
# Codex uses TOML (not JSON). Reference: https://developers.openai.com/codex/config-reference

# model = "gpt-5-codex"            # uncomment to pin a model; default = Codex's recommended model
model_reasoning_effort = "medium"   # minimal | low | medium | high
approval_policy = "on-request"      # untrusted | on-failure | on-request | never
sandbox_mode = "workspace-write"    # read-only | workspace-write | danger-full-access

# AGENTS.md is read natively; also pick up CLAUDE.md / GEMINI.md in repos that only have those.
project_doc_fallback_filenames = ["CLAUDE.md", "GEMINI.md"]

[sandbox_workspace_write]
network_access = false

# ---------- Profiles: `codex --profile <name>` ----------
[profiles.readonly]
sandbox_mode = "read-only"
approval_policy = "on-request"

[profiles.deep]
model_reasoning_effort = "high"

# ---------- MCP servers (mirrors ../mcp/servers.json) ----------
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[mcp_servers.fetch]
command = "uvx"
args = ["mcp-server-fetch"]

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PERSONAL_ACCESS_TOKEN"

[mcp_servers.brave-search]
command = "npx"
args = ["-y", "@brave/brave-search-mcp-server"]
env_vars = ["BRAVE_API_KEY"]
