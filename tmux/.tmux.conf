### rebind hotkey
# prefix setting (screen-like)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# reload config without killing server
bind R source-file ~/.tmux.conf \; display-message "Config reloaded..."

# "|" splits the current window vertically, and "-" splits it horizontally
unbind '%'
unbind '"'
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-like)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r Left resize-pane -L 4
bind -r Down resize-pane -D 4
bind -r Up resize-pane -U 4
bind -r Right resize-pane -R 4
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

# Copy mode (vi keys); copy to Windows clipboard via clip.exe (WSL)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "clip.exe"

### other optimization

# display things in 256 colors
set -g default-terminal "tmux-256color"
# enable true color (24-bit) passthrough
set -as terminal-features ",*:RGB"

# history size
set -g history-limit 50000

# fix delay
set -s escape-time 0

# mouse support (scroll, select pane, resize)
set -g mouse on

# pass focus events to apps (vim autoread etc.)
set -g focus-events on

# faster repeat / message display
set -g repeat-time 600
set -g display-time 1500

# resize to smallest client only when it is actually viewing the window
setw -g aggressive-resize on

# status bar
set -g status-interval 5
set -g status-bg colour235
set -g status-fg colour250
set -g status-left "#[bold]#S "
set -g status-right "%m/%d %H:%M"
setw -g window-status-current-style "fg=colour16,bg=colour39,bold"

# 0 is too far
set -g base-index 1
setw -g pane-base-index 1

# stop auto renaming
setw -g automatic-rename off
set-option -g allow-rename off

# renumber windows sequentially after closing
set -g renumber-windows on

# window notifications; display activity on other window
setw -g monitor-activity on
set -g visual-activity on
